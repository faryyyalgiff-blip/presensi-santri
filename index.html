<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presensi Santri - Scanner</title>
  <!-- Library Scanner Ringan & Cepat -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 480px;
    }

    h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    p.subtitle { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    /* Container Kamera */
    .scanner-card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      position: relative;
    }

    #reader { width: 100%; border: none !important; }
    #reader video { object-fit: cover; border-radius: 16px; }

    .status-bar {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-top: 1px solid #334155;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #10b981;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* CSS Tombol Putar Kamera */
    .btn-switch {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-switch:active { background: #475569; }

    /* Overlay Modal Hasil Scan */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center; padding: 20px;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px;
      text-align: center; border: 2px solid #334155; transform: translateY(20px); transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-box { transform: translateY(0); }
    .modal-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; }
    .success .modal-icon { background: #065f46; color: #34d399; }
    .error .modal-icon { background: #7f1d1d; color: #f87171; }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; }
    .santri-name { font-size: 1.4rem; font-weight: 800; color: #f8fafc; margin: 8px 0 4px; }
    .santri-meta { font-size: 0.9rem; color: #38bdf8; font-weight: 600; margin-bottom: 12px; }
    .jam-badge { display: inline-block; background: #334155; padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; color: #e2e8f0; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>PRESENSI SANTRI</h1>
    <p class="subtitle">Pondok Pesantren Nihaadll Fuqoro</p>
  </header>

  <div class="scanner-card">
    <div id="reader"></div>
    <div class="status-bar">
      <div class="badge-status">
        <span class="dot"></span> Aktif
      </div>
      <!-- Tombol Tukar Kamera -->
      <button id="btnSwitchCam" class="btn-switch">🔄 Putar Kamera</button>
      <div id="clock" style="color: #94a3b8; font-family: monospace;">--:--:--</div>
    </div>
  </div>

  <!-- Pop-Up Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box" id="modalBox">
      <div class="modal-icon" id="modalIcon">✓</div>
      <h2 class="modal-title" id="modalTitle">PRESENSI BERHASIL</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // URL Web App Google Apps Script Milikmu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUQd95-_l103NHcbqPPvNv5ILl0-qVLA4xGtmFaLAAkng8FfmNB6PviiU9mEl-CrjKpA/exec";

    let isProcessScanning = true; 
    let html5QrCode = null;
    let isCameraOn = false;
    let currentFacingMode = "environment"; // Kamera belakang default

    // Jam Digital Realtime
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID');
    }, 1000);

    // Audio Notifikasi (Bip Sintetis)
    function playBeep(success = true) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.type = "sine";
        osc.frequency.setValueAtTime(success ? 880 : 300, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {
        console.log("Audio not supported");
      }
    }

    // Fungsi Menyalakan Kamera
    function initScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
      
      html5QrCode.start(
        { facingMode: currentFacingMode },
        config,
        onScanSuccess
      ).then(() => {
        isCameraOn = true;
        isProcessScanning = true;
      }).catch(err => {
        console.error("Gagal membuka kamera:", err);
      });
    }

    // Fungsi Mematikan Kamera (Penting untuk melepas freeze memori)
    function stopScanner() {
      if (html5QrCode && isCameraOn) {
        return html5QrCode.stop().then(() => {
          isCameraOn = false;
        }).catch(err => console.error(err));
      }
      return Promise.resolve();
    }

    // EVENT 1: Tombol Putar Kamera Diklik
    document.getElementById("btnSwitchCam").addEventListener("click", async () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await stopScanner(); // Matikan dulu
      initScanner();       // Nyalakan ulang dengan mode baru
    });

    // EVENT 2: Mencegah Freeze Saat Pindah Aplikasi / Layar HP Mati
    document.addEventListener("visibilitychange", async () => {
      if (document.hidden) {
        // Saat buka WhatsApp / minimize, matikan kamera otomatis
        await stopScanner();
      } else {
        // Saat kembali ke web, beri jeda 0.5 detik lalu nyalakan otomatis
        setTimeout(initScanner, 500); 
      }
    });

    // Ketika Kartu QR Terdeteksi Kamera
    async function onScanSuccess(decodedText) {
      if (!isProcessScanning) return;
      isProcessScanning = false; // Kunci sementara agar tidak double scan

      playBeep(true);
      showLoading();

      try {
        const formData = new URLSearchParams();
        formData.append("id_qr", decodedText.trim());

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: formData
        });

        const res = await response.json();

        if (res.success) {
          showModal(true, res.message, res.data);
        } else {
          playBeep(false);
          showModal(false, res.message);
        }
      } catch (err) {
        playBeep(false);
        showModal(false, "Gagal terhubung ke database. Periksa koneksi internet.");
      }
    }

    function showLoading() {
      const modal = document.getElementById("modal");
      const box = document.getElementById("modalBox");
      box.className = "modal-box";
      document.getElementById("modalIcon").textContent = "⏳";
      document.getElementById("modalTitle").textContent = "MEMPROSES...";
      document.getElementById("modalBody").innerHTML = `<p class="modal-desc">Memeriksa data kartu...</p>`;
      modal.classList.add("active");
    }

    function showModal(isSuccess, message, data = null) {
      const modal = document.getElementById("modal");
      const box = document.getElementById("modalBox");
      const icon = document.getElementById("modalIcon");
      const title = document.getElementById("modalTitle");
      const body = document.getElementById("modalBody");

      if (isSuccess) {
        box.className = "modal-box success";
        icon.textContent = "✓";
        title.textContent = `ABSEN ${data.tipe} BERHASIL`;
        body.innerHTML = `
          <div class="santri-name">${data.nama}</div>
          <div class="santri-meta">${data.kelas}</div>
          <div class="jam-badge">${data.jam} WIB</div>
        `;
      } else {
        box.className = "modal-box error";
        icon.textContent = "✕";
        title.textContent = "ABSENSI GAGAL";
        body.innerHTML = `<p class="modal-desc" style="color: #fca5a5;">${message}</p>`;
      }

      modal.classList.add("active");

      // Jeda 3 detik lalu kembali ke mode siap kamera
      setTimeout(() => {
        modal.classList.remove("active");
        isProcessScanning = true;
      }, 3000);
    }

    // Jalankan kamera pertama kali web dibuka
    window.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
